name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # 關鍵：在工作流程層級直接清空 GitHub Actions 預設的 NDK 路徑
    env:
      ANDROID_NDK: ""
      ANDROID_NDK_ROOT: ""
      ANDROID_NDK_HOME: ""
      ANDROID_NDK_LATEST_HOME: ""

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies & Buildozer
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev
        pip install --upgrade pip setuptools
        pip install "cython<3.0.0" buildozer

    - name: Clean & Build APK
      run: |
        export BUILDOZER_ACCEPT_SDK_LICENSE=1
        # 刪除舊快取，確保不受舊構建影響
        rm -rf .buildozer bin
        # 執行打包
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VocabularyApp-APK
        path: bin/*.apk
